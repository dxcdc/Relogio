{% extends "base.html" %}
{% block title %}Senha Alterada{% endblock %}

{% block auth_content %}
<div class="login-page">
    <div class="login-left">
        <div class="login-bg-shape shape-1"></div>
        <div class="login-bg-shape shape-2"></div>
    </div>
    <div class="login-right">
        <div class="login-form-container text-center">
            <div class="mb-4">
                <div class="stat-icon-green mx-auto mb-3" style="width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px;">
                    <i class="bi bi-check2-circle"></i>
                </div>
            </div>
            <h1 class="login-title mb-3">Senha Alterada!</h1>
            <p class="login-subtitle">Sua senha foi redefinida com sucesso. Você já pode acessar o sistema com sua nova credencial.</p>

            <div class="mt-5">
                <a href="{% url 'login' %}" class="btn-premium w-100 text-decoration-none d-inline-flex justify-content-center">
                    Fazer Login <i class="bi bi-box-arrow-in-right ms-2 transition-icon"></i>
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
