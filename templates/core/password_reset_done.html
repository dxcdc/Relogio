{% extends "base.html" %}
{% block title %}E-mail Enviado{% endblock %}

{% block auth_content %}
<div class="login-page">
    <div class="login-left">
        <div class="login-bg-shape shape-1"></div>
        <div class="login-bg-shape shape-2"></div>
    </div>
    <div class="login-right">
        <div class="login-form-container text-center">
            <div class="mb-4">
                <div class="stat-icon-green mx-auto mb-3" style="width: 72px; height: 72px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px;">
                    <i class="bi bi-envelope-check"></i>
                </div>
            </div>
            <h1 class="login-title mb-3">Verifique seu E-mail</h1>
            <p class="login-subtitle">Enviamos instruções detalhadas e um link seguro para a redefinição de sua senha. Por favor, verifique também sua pasta de Spam.</p>

            <div class="mt-5">
                <a href="{% url 'login' %}" class="btn-outline-orange w-100 d-inline-block py-3 text-decoration-none">
                    <i class="bi bi-arrow-left me-2"></i> Retornar ao Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
