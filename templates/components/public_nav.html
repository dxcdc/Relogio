{% load static %}
<style>
.public-site-nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  display: flex; align-items: center; justify-content: space-between;
  padding: 24px 60px;
  background: transparent;
  transition: background .6s, padding .5s, border-bottom .5s, backdrop-filter .5s;
}
.public-site-nav.sc, body:not(.is-landing) .public-site-nav {
  background: rgba(240,240,240,.88);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border-bottom: 1px solid var(--ink3, rgba(0,0,0,0.07));
  padding: 16px 60px;
}
.public-nav-brand {
  font-size: 15px; font-weight: 700; letter-spacing: -.3px;
  display: flex; align-items: center; gap: 10px;
  text-decoration: none; color: #000;
}
.public-nav-brand img { width: 36px; height: 36px; object-fit: contain; }
.public-nav-links {
  display: flex; gap: 40px;
  font-size: 12px; font-weight: 400; letter-spacing: .5px;
  color: var(--ink2, #4b5563);
}
.public-nav-links a { 
  display: flex; align-items: center; gap: 8px;
  transition: color 0.2s ease; 
  position: relative;
  padding-bottom: 4px;
  text-decoration: none;
  color: inherit;
}
.public-nav-links a::after {
  content: ''; position: absolute; left: 0; bottom: 0;
  width: 0%; height: 2px;
  background-color: var(--green, #0dc02a);
  transition: width 0.3s ease; border-radius: 2px;
}
.public-nav-links a i { font-size: 14px; opacity: 0.8; transition: transform .3s; }
.public-nav-links a:hover { color: var(--green, #0dc02a); }
.public-nav-links a:hover::after { width: 100%; }
.public-nav-links a:hover i { transform: scale(1.15); }

.public-nav-cta {
  font-size: 12px; font-weight: 600; letter-spacing: .5px;
  padding: 12px 28px; border-radius: 100px;
  background: var(--navy, #101624); color: #fff;
  display: flex; align-items: center; gap: 7px;
  text-decoration: none;
  transition: background .3s, transform .3s;
}
.public-nav-cta:hover { background: var(--green, #0dc02a); color: #fff; transform: translateY(-1px); }

.public-nav-theme-btn {
  font-size: 12px; font-weight: 600; letter-spacing: .3px;
  padding: 10px 18px; border-radius: 100px;
  background: rgba(255, 255, 255, 0.15); color: #000;
  border: 1px solid rgba(0, 0, 0, 0.2);
  display: flex; align-items: center; gap: 7px;
  cursor: pointer; transition: all .3s ease;
}
.public-nav-theme-btn:hover, .public-nav-theme-btn.active {
  background: linear-gradient(135deg, #8B351E, #E84621) !important;
  color: #fff !important;
  border-color: #E84621 !important;
  box-shadow: 0 4px 12px rgba(232, 70, 33, 0.35) !important;
}

@media(max-width:1024px) {
  .public-site-nav { padding: 18px 24px; }
  .public-site-nav.sc, body:not(.is-landing) .public-site-nav { padding: 14px 24px; }
  .public-nav-links { display: none; }
}
</style>

<link rel="stylesheet" href="{% static 'css/themes_extended.css' %}">

<nav id="nav" class="public-site-nav">
  <a href="/" class="public-nav-brand">
    <img src="{% static 'img/cdc_icon.png' %}" alt="CDC">
    CDC <span style="font-weight:300;opacity:.5;margin-left:3px">RH</span>
  </a>
  <div class="public-nav-links">
    {% if vagas_page %}
      <a href="/"><i class="bi bi-house-fill"></i> Início</a>
    {% endif %}
  </div>
  
  <div style="display: flex; align-items: center; gap: 10px;">
    
    <!-- Menu Dropdown Seletor de Temas -->
    <div class="theme-dropdown">
      <button type="button" class="theme-dropdown-btn" onclick="toggleThemeDropdown(event)">
        <i class="bi bi-palette-fill"></i>
        <span id="currentThemeLabel">Temas</span>
        <i class="bi bi-chevron-down" style="font-size: 10px; opacity: 0.6;"></i>
      </button>
      <div class="theme-dropdown-menu" id="themeDropdownMenu">
        <button type="button" class="theme-opt" onclick="selectTheme('default')">
          <span class="theme-dot" style="background: #00AA45;"></span> CDC Essencial
        </button>
        <button type="button" class="theme-opt" onclick="selectTheme('cdc')">
          <span class="theme-dot" style="background: #E84621;"></span> CDC Logo (Vinho/Laranja)
        </button>
        <button type="button" class="theme-opt" onclick="selectTheme('dark')">
          <span class="theme-dot" style="background: #0F172A;"></span> Modo Noturno (Dark)
        </button>
        <button type="button" class="theme-opt" onclick="selectTheme('ocean')">
          <span class="theme-dot" style="background: #0284C7;"></span> Azul Corporativo (Ocean)
        </button>
      </div>
    </div>

    {% if request.path == '/login/' or request.path == '/login' %}
      <a href="/" class="public-nav-cta">
        <i class="bi bi-house"></i>
        Início
      </a>
    {% else %}
      <a href="/login/" class="public-nav-cta">
        <i class="bi bi-box-arrow-in-right"></i>
        Login
      </a>
    {% endif %}
  </div>
</nav>

<script>
function toggleThemeDropdown(e) {
  e.stopPropagation();
  const menu = document.getElementById('themeDropdownMenu');
  if (menu) menu.classList.toggle('show');
}

function selectTheme(themeName) {
  localStorage.setItem('cdc_selected_theme', themeName);
  applySelectedTheme(themeName);
  const menu = document.getElementById('themeDropdownMenu');
  if (menu) menu.classList.remove('show');
}

function applySelectedTheme(themeName) {
  const selected = themeName || localStorage.getItem('cdc_selected_theme') || 'default';
  document.documentElement.setAttribute('data-theme', selected);
  
  // Atualiza classes no body
  document.body.classList.remove('theme-cdc', 'theme-dark', 'theme-ocean');
  if (selected !== 'default') {
    document.body.classList.add('theme-' + selected);
  }
  
  const label = document.getElementById('currentThemeLabel');
  if (label) {
    if (selected === 'cdc') label.textContent = 'CDC Logo';
    else if (selected === 'dark') label.textContent = 'Noturno';
    else if (selected === 'ocean') label.textContent = 'Azul';
    else label.textContent = 'CDC Essencial';
  }
}

document.addEventListener('click', function() {
  const menu = document.getElementById('themeDropdownMenu');
  if (menu) menu.classList.remove('show');
});

document.addEventListener('DOMContentLoaded', function() {
  applySelectedTheme();
});
applySelectedTheme();
</script>
