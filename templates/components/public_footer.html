{% load static %}
<style>
/* ═══ FOOTER UNIFICADO (1 LINHA) ══════════════════ */
.public-footer {
  background: #080808; color: rgba(255,255,255,.55);
  padding: 16px 60px;
  position: relative; z-index: 10;
  border-top: 1px solid rgba(255,255,255,.07);
}
.public-foot-inner {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: nowrap; gap: 24px;
}
.public-foot-desc {
  font-size: 13px; font-weight: 400;
  color: rgba(255,255,255,.65);
  margin-bottom: 0;
}
.public-foot-contact { display: flex; flex-direction: row; gap: 20px; flex-shrink: 0; }
.public-foot-contact-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,.8);
  text-decoration: none; transition: color .2s;
}
.public-foot-contact-item i { color: var(--green, #0dc02a); font-size: 14px; flex-shrink: 0; }
.public-foot-contact-item:hover { color: #fff; }
.public-foot-social-block { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.public-foot-socials { display: flex; gap: 8px; }
.public-foot-soc {
  width: 32px; height: 32px; border-radius: 8px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: rgba(255,255,255,.7); text-decoration: none; transition: all .2s;
}
.public-foot-soc:hover { color: var(--green, #0dc02a); border-color: rgba(0,170,69,.35); background: rgba(0,170,69,.12); transform: translateY(-2px); }

.public-foot-copyright {
  font-size: 12px;
  color: rgba(255,255,255,.3);
  white-space: nowrap;
}

@media(max-width:1024px) {
  .public-footer { padding: 16px 24px; }
  .public-foot-inner { flex-direction: column; text-align: center; gap: 12px; }
  .public-foot-contact { justify-content: center; }
}
