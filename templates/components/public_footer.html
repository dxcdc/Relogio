{% load static %}
<style>
/* ═══ FOOTER INSTITUCIONAL COMPLETO (LINHA ÚNICA) ═════ */
.public-footer {
  background: #080808; color: rgba(255,255,255,.55);
  padding: 24px 60px 16px;
  position: relative; z-index: 10;
  border-top: 1px solid rgba(255,255,255,.07);
}
.public-foot-inner {
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: nowrap; gap: 20px;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.public-foot-brand-block { display: flex; align-items: center; gap: 15px; }
.public-foot-desc {
  font-size: 13px; font-weight: 400;
  color: rgba(255,255,255,.65); line-height: 1.4;
  margin-bottom: 0; white-space: nowrap;
}
.public-foot-contact { display: flex; flex-direction: row; gap: 20px; flex-shrink: 0; }
.public-foot-contact-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,.8);
  text-decoration: none; transition: color .2s; white-space: nowrap;
}
.public-foot-contact-item i { color: var(--green, #0dc02a); font-size: 14px; flex-shrink: 0; }
.public-foot-contact-item:hover { color: #fff; }
.public-foot-social-block { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.public-foot-socials { display: flex; gap: 8px; }
.public-foot-soc {
  width: 34px; height: 34px; border-radius: 10px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: rgba(255,255,255,.7); text-decoration: none; transition: all .2s;
}
.public-foot-soc:hover { color: var(--green, #0dc02a); border-color: rgba(0,170,69,.35); background: rgba(0,170,69,.12); transform: translateY(-2px); }

.public-foot-bottom {
  display: flex; flex-direction: row; align-items: center; justify-content: space-between;
  text-align: center; gap: 12px;
  padding: 14px 0 0;
  font-size: 12px; font-weight: 400; color: rgba(255,255,255,.45);
}

@media(max-width:1024px) {
  .public-footer { padding: 24px 20px 16px; }
  .public-foot-inner { flex-direction: column; align-items: center; text-align: center; gap: 16px; flex-wrap: wrap; }
  .public-foot-desc, .public-foot-contact-item { white-space: normal; }
  .public-foot-contact { align-items: center; justify-content: center; }
  .public-foot-bottom { flex-direction: column; }
}
</style>

<footer class="public-footer">
  <div class="public-foot-inner">
    <div class="public-foot-brand-block">
      <p class="public-foot-desc">
        A plataforma completa de RH para equipes do CDC.
      </p>
    </div>

    <div class="public-foot-contact">
      <a href="tel:8132246963" class="public-foot-contact-item">
        <i class="bi bi-telephone-fill"></i>
        (81) 3224-6963
      </a>
      <a href="mailto:rh@cdc.org.br" class="public-foot-contact-item">
        <i class="bi bi-envelope-fill"></i>
        rh@cdc.org.br
      </a>
    </div>

    <div class="public-foot-social-block" style="margin-left: auto;">
      <div class="public-foot-socials">
        <a class="public-foot-soc" href="https://www.linkedin.com/company/centro-de-desenvolvimento-e-cidadania/" target="_blank" rel="noopener" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
        <a class="public-foot-soc" href="https://www.instagram.com/cdc_osc/" target="_blank" rel="noopener" title="Instagram"><i class="bi bi-instagram"></i></a>
      </div>
    </div>
  </div>

  <div class="public-foot-bottom">
    <span>· CDC Relógio &copy; 2026 Todos os direitos reservados ·</span>
    <span>· Centro de Desenvolvimento e Cidadania - CDC · CNPJ 03.970.166/0001-29 ·</span>
  </div>
</footer>
