{% load static %}
<style>
/* ═══ FOOTER INSTITUCIONAL ═════════════════════════════ */
.public-footer {
  background: #080808; color: rgba(255,255,255,.55);
  padding: 28px 60px 20px;
  position: relative; z-index: 10;
  border-top: 1px solid rgba(255,255,255,.07);
}

.public-foot-inner {
  display: flex; align-items: center; justify-content: space-between;
  gap: 20px; flex-wrap: nowrap;
  padding-bottom: 20px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}

/* Bloco Esquerda: Marca + Contatos logo abaixo da logo */
.public-foot-brand-group {
  display: flex; flex-direction: column; gap: 10px;
}
.public-foot-brand-block {
  display: flex; align-items: center; gap: 12px;
}
.public-foot-logo {
  width: 32px; height: 32px; object-fit: contain; flex-shrink: 0;
}
.public-foot-desc {
  font-size: 13.5px; font-weight: 400;
  color: rgba(255,255,255,.8); margin-bottom: 0;
  white-space: nowrap;
}

/* Contatos dispostos abaixo da logo/texto */
.public-foot-contact {
  display: flex; align-items: center; gap: 24px;
  padding-left: 44px;
}
.public-foot-contact-item {
  display: flex; align-items: center; gap: 8px;
  font-size: 13px; font-weight: 500; color: rgba(255,255,255,.75);
  text-decoration: none; transition: color .2s;
  white-space: nowrap;
}
.public-foot-contact-item i { color: var(--green, #0dc02a); font-size: 14px; }
.public-foot-contact-item:hover { color: #fff; }

/* Bloco Direita: Redes Sociais */
.public-foot-social-block {
  display: flex; align-items: center; gap: 8px;
  margin-left: auto; flex-shrink: 0;
}
.public-foot-soc {
  width: 38px; height: 38px; border-radius: 10px;
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; color: rgba(255,255,255,.75); text-decoration: none;
  transition: all .2s ease;
}
.public-foot-soc:hover {
  color: var(--green, #0dc02a);
  border-color: rgba(0,170,69,.35);
  background: rgba(0,170,69,.12);
  transform: translateY(-2px);
}

/* LINHA BASE: Copyright & CNPJ */
.public-foot-bottom {
  display: flex; flex-direction: row; align-items: center; justify-content: center;
  text-align: center; gap: 12px; padding-top: 16px;
  font-size: 12px; font-weight: 400; color: rgba(255,255,255,.4);
}

@media(max-width:900px) {
  .public-footer { padding: 24px 20px 16px; }
  .public-foot-inner { flex-direction: column; text-align: center; gap: 16px; }
  .public-foot-brand-group { align-items: center; text-align: center; }
  .public-foot-contact { padding-left: 0; justify-content: center; flex-wrap: wrap; }
  .public-foot-social-block { margin-left: 0; }
  .public-foot-desc { white-space: normal; }
  .public-foot-bottom { flex-direction: column; gap: 6px; }
}
</style>

<footer class="public-footer">
  <div class="public-foot-inner">
    <!-- Bloco Esquerda: Marca + Contatos logo em baixo da logo -->
    <div class="public-foot-brand-group">
      <div class="public-foot-brand-block">
        <img src="{% static 'img/cdc_icon.png' %}" alt="CDC" class="public-foot-logo">
        <span class="public-foot-desc">A plataforma completa de RH para equipes do CDC.</span>
      </div>
      <div class="public-foot-contact">
        <a href="tel:8132246963" class="public-foot-contact-item">
          <i class="bi bi-telephone-fill"></i>
          (81) 3224-6963
        </a>
        <a href="mailto:rh@cdc.org.br" class="public-foot-contact-item">
          <i class="bi bi-envelope-fill"></i>
          rh@cdc.org.br
        </a>
      </div>
    </div>

    <!-- Bloco Direita: Redes Sociais -->
    <div class="public-foot-social-block">
      <a class="public-foot-soc" href="https://www.linkedin.com/company/centro-de-desenvolvimento-e-cidadania/" target="_blank" rel="noopener" title="LinkedIn"><i class="bi bi-linkedin"></i></a>
      <a class="public-foot-soc" href="https://www.instagram.com/cdc_osc/" target="_blank" rel="noopener" title="Instagram"><i class="bi bi-instagram"></i></a>
    </div>
  </div>

  <!-- LINHA BASE: Copyright & CNPJ -->
  <div class="public-foot-bottom">
    <span>· CDC Relógio &copy; 2026 Todos os direitos reservados ·</span>
    <span>· Centro de Desenvolvimento e Cidadania - CDC · CNPJ 03.970.166/0001-29 ·</span>
  </div>
</footer>
