{% extends "base.html" %}
{% block title %}Excluir Escala{% endblock %}
{% block content %}
<div class="row justify-content-center pt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card text-center pb-4 pt-2">
            <div class="card-body">
                <div class="mb-4">
                    <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem;"></i>
                </div>
                <h3 class="fw-bold mb-3">Excluir Escala</h3>
                <p class="text-muted mb-4">Tem certeza que deseja excluir a escala de trabalho <strong>"{{ schedule.name }}"</strong>?<br>Esta ação não pode ser desfeita.</p>
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <a href="{% url 'schedule_list' %}" class="btn btn-outline-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-danger"><i class="bi bi-trash me-1"></i> Excluir Definitivamente</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
