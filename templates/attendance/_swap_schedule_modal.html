
<div class="modal fade" id="adminScheduleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content" style="border-radius: 20px; border: none; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);">
            <div class="modal-header align-items-start flex-wrap" style="border-bottom: 1px solid #e2e8f0; padding: 24px;">
                <div class="d-flex flex-column pe-3" style="width: calc(100% - 32px);">
                    <h5 class="modal-title" style="font-weight: 700; color: #1e1b4b; margin: 0; line-height: 1.3;">
                        <i class="bi bi-calendar-range text-success me-2"></i> Escalas Programadas
                    </h5>
                    <div class="d-flex flex-wrap align-items-center gap-2 mt-2">
                        <span class="text-muted" style="font-size: 14px;">Visualização da Troca</span>
                        <div id="sched-overall-status"></div>
                    </div>
                </div>
                <button type="button" class="btn-close flex-shrink-0" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="d-flex align-items-center mb-4" style="background: #f8fafc; padding: 16px; border-radius: 12px; font-size: 15px;">
                    <i class="bi bi-calendar-check text-success me-2"></i> 
                    <span style="font-weight: 600; color: #475569;">Data Escalonada: </span> 
                    <strong id="sched-date" class="ms-2" style="font-size: 16px; color: #0f172a;">--/--/----</strong>
                </div>
                
                <div class="row g-4">
                    <div class="col-md-6">
                        <div style="background: white; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; height: 100%;">
                            <div style="background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 12px 16px; font-weight: 700; color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">
                                Solicitante (Você)
                            </div>
                            <div style="padding: 24px; text-align: center;">
                                <div id="sched-req-avatar" style="width: 72px; height: 72px; border-radius: 50%; background: #e0e7ff; color: #4f46e5; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px;">
                                    <i class="bi bi-person-fill"></i>
                                </div>
                                <h6 id="sched-req-name" style="font-weight: 700; color: #1e1b4b; margin-bottom: 4px; font-size: 16px;">---</h6>
                                <div id="sched-req-time" style="color: #64748b; font-size: 14px; margin-bottom: 16px; font-weight: 500;">---</div>
                                <div id="sched-req-status"></div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div style="background: white; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; height: 100%;">
                            <div style="background: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 12px 16px; font-weight: 700; color: #64748b; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px;">
                                Destino (Colega)
                            </div>
                            <div style="padding: 24px; text-align: center;">
                                <div id="sched-tgt-avatar" style="width: 72px; height: 72px; border-radius: 50%; background: #e0e7ff; color: #4f46e5; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px;">
                                    <i class="bi bi-person-fill"></i>
                                </div>
                                <h6 id="sched-tgt-name" style="font-weight: 700; color: #1e1b4b; margin-bottom: 4px; font-size: 16px;">---</h6>
                                <div id="sched-tgt-time" style="color: #64748b; font-size: 14px; margin-bottom: 16px; font-weight: 500;">---</div>
                                <div id="sched-tgt-status"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div id="sched-timeline-container" style="margin-top: 24px;"></div>
            </div>
            <div class="modal-footer" id="sched-modal-footer" style="border-top: 1px solid #e2e8f0; padding: 16px 24px; background: #f8fafc; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px;">
                <button type="button" class="btn btn-light border rounded-pill px-4" data-bs-dismiss="modal">Entendido</button>
                <div id="sched-actions" class="d-flex gap-2"></div>
            </div>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function() {
        const adminModal = document.getElementById('adminScheduleModal');
        if(adminModal) {
            document.body.appendChild(adminModal);
            
            adminModal.addEventListener('show.bs.modal', function(event) {
                const button = event.relatedTarget;
                const reqId = button.getAttribute('data-request-id');
                
                // Clear state
                document.getElementById('sched-date').textContent = 'Carregando...';
                document.getElementById('sched-req-name').textContent = '...';
                document.getElementById('sched-tgt-name').textContent = '...';
                document.getElementById('sched-req-avatar').innerHTML = '<i class="bi bi-person-fill"></i>';
                document.getElementById('sched-tgt-avatar').innerHTML = '<i class="bi bi-person-fill"></i>';
                document.getElementById('sched-overall-status').innerHTML = '';
                document.getElementById('sched-timeline-container').innerHTML = '';
                document.getElementById('sched-actions').innerHTML = '';
                
                fetch(`/attendance/swap/schedules/${reqId}/`)
                .then(r => r.json())
                .then(data => {
                    document.getElementById('sched-date').textContent = data.date;
                    
                    document.getElementById('sched-req-name').textContent = data.requester.name;
                    document.getElementById('sched-tgt-name').textContent = data.target.name;
                    
                    if (data.requester.image) {
                        document.getElementById('sched-req-avatar').innerHTML = `<img src="${data.requester.image}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
                    }
                    if (data.target.image) {
                        document.getElementById('sched-tgt-avatar').innerHTML = `<img src="${data.target.image}" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
                    }
                    
                    document.getElementById('sched-req-time').textContent = data.requester.working ? `${data.requester.in_time} - ${data.requester.out_time}` : 'FOLGA';
                    let reqBadge = data.requester.working ? `<span class="status-pill status-approved px-3 py-2 text-white" style="background:#10b981; border:none; letter-spacing:1px;">Jornada de Trabalho</span>` : `<span class="status-pill status-neutral px-3 py-2" style="background:#e2e8f0; border:none; letter-spacing:1px;">Dia de Folga</span>`;
                    document.getElementById('sched-req-status').innerHTML = reqBadge;
                    
                    document.getElementById('sched-tgt-time').textContent = data.target.working ? `${data.target.in_time} - ${data.target.out_time}` : 'FOLGA';
                    let tgtBadge = data.target.working ? `<span class="status-pill status-approved px-3 py-2 text-white" style="background:#10b981; border:none; letter-spacing:1px;">Jornada de Trabalho</span>` : `<span class="status-pill status-neutral px-3 py-2" style="background:#e2e8f0; border:none; letter-spacing:1px;">Dia de Folga</span>`;
                    document.getElementById('sched-tgt-status').innerHTML = tgtBadge;
                    
                    // Status Geral da Troca no Header
                    let statusColor = '#f1f5f9'; let textCol = '#475569'; let borderCol = '#e2e8f0';
                    if(data.status_code === 'APPROVED') { statusColor = '#f0fdf4'; textCol = '#166534'; borderCol = '#dcfce3'; }
                    else if(data.status_code === 'REJECTED') { statusColor = '#fef2f2'; textCol = '#991b1b'; borderCol = '#fee2e2'; }
                    else if(data.status_code.includes('PENDING')) { statusColor = '#fffcf0'; textCol = '#d97706'; borderCol = '#fef3c7'; }
                    
                    let resolvedInfo = data.resolved_text ? ` <span style="font-weight:normal; opacity:0.8;">(${data.resolved_text})</span>` : '';
                    document.getElementById('sched-overall-status').innerHTML = `<span class="status-pill" style="background:${statusColor}; color:${textCol}; border:1px solid ${borderCol}; font-size:12px; padding:6px 14px;">${data.status_display}${resolvedInfo}</span>`;
                    
                    // Action Buttons (Aprovar/Rejeitar) based on permissions from backend
                    let actionHtml = '';
                    if (data.can_reject) {
                        actionHtml += `<button onclick="resolveSwapModal(${reqId}, 'REJ')" class="btn btn-outline-danger rounded-pill px-4" style="background: white; border: 1px solid #fca5a5;"><i class="bi bi-x-lg me-1"></i> Rejeitar</button>`;
                    }
                    if (data.can_approve) {
                        let btnTxt = 'Autorizar';
                        if (data.status_code === 'PENDING_TARGET') btnTxt = 'Aceitar Troca';
                        if (data.status_code === 'PENDING_HR') btnTxt = 'Efetivar Troca';
                        actionHtml += `<button onclick="resolveSwapModal(${reqId}, 'APP')" class="btn text-white rounded-pill px-4 hover-up" style="background: #10b981; border: none; font-weight: 600;"><i class="bi bi-check-lg me-1"></i> ${btnTxt}</button>`;
                    }
                    document.getElementById('sched-actions').innerHTML = actionHtml;
                    
                    // Render Timeline
                    if(data.timeline) {
                        let timelineHtml = `<div style="background:#f8fafc; border:1px solid #e2e8f0; border-radius:16px; padding:24px;">
                            <span class="d-block mb-4" style="font-size:12px; font-weight:800; color:#475569; text-transform:uppercase; letter-spacing:0.5px;"><i class="bi bi-signpost-split me-2 text-primary" style="font-size:14px;"></i> Fluxo de Aprovação</span>`;
                            
                        data.timeline.forEach((step, index) => {
                            let isLast = index === data.timeline.length - 1;
                            let bgCol = step.state === 'done' || step.state === 'current' ? '#10b981' : (step.state === 'rejected' ? '#ef4444' : '#e2e8f0');
                            let lineCol = step.state === 'done' ? '#10b981' : '#e2e8f0';
                            if (step.state === 'current') { bgCol = '#f59e0b'; }
                            
                            let iconColor = step.state === 'waiting' ? '#64748b' : '#fff';
                            let descColor = step.state === 'current' ? 'color:#f59e0b;font-weight:600;' : 'color:#64748b;';
                            if (step.state === 'rejected') descColor = 'color:#ef4444;font-weight:600;';
                            
                            let theIcon = step.icon;
                            if(step.state === 'done' && index > 0) theIcon = 'bi-check-lg';
                            if(step.state === 'rejected') theIcon = 'bi-x-lg';
                            if(step.state === 'current' && index > 0) theIcon = 'bi-hourglass-split';
                            
                            timelineHtml += `
                            <div style="display:flex;gap:16px;align-items:stretch;">
                                <div style="display:flex;flex-direction:column;align-items:center;">
                                    <div style="width:32px;height:32px;border-radius:50%;background:${bgCol};color:${iconColor};display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;box-shadow:0 0 0 4px #f8fafc;"><i class="bi ${theIcon}"></i></div>
                                    ${!isLast ? `<div style="width:2px;flex-grow:1;min-height:24px;background:${lineCol};margin:2px 0;"></div>` : ''}
                                </div>
                                <div style="padding-bottom:${isLast ? '0' : '20px'}; padding-top:4px;">
                                    <div style="font-size:15px;font-weight:700;color:#0f172a;line-height:1.2;">${step.label}</div>
                                    <div style="font-size:13px;margin-top:4px;${descColor}">${step.desc}</div>
                                </div>
                            </div>`;
                        });
                        timelineHtml += `</div>`;
                        document.getElementById('sched-timeline-container').innerHTML = timelineHtml;
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('sched-date').textContent = 'Erro ao carregar';
                });
            });
        }
    });

    if (typeof resolveSwapModal !== 'function') {
        window.resolveSwapModal = function(reqId, action) {
            if(!confirm(action === 'APP' ? 'Confirmar aprovação?' : 'Confirmar rejeição?')) return;
            
            fetch('/attendance/swap/resolve/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]') ? document.querySelector('[name=csrfmiddlewaretoken]').value : ''
                },
                body: JSON.stringify({ request_id: reqId, action: action })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if(data.success) {
                    window.location.reload();
                }
            })
            .catch(err => {
                console.error(err);
                alert("Erro ao processar solicitação.");
            });
        }
    }
</script>
