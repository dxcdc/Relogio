{% extends "base.html" %}
{% block title %}Classes Salariais{% endblock %}
{% block content %}
<div class="page-header d-flex justify-content-between align-items-center mb-4">
    <div class="d-flex align-items-center gap-3">
        <div class="d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; background: linear-gradient(135deg, #10b981, #059669); border-radius: 14px; color: white; font-size: 20px; box-shadow: 0 4px 10px rgba(16, 185, 129, 0.3);">
            <i class="bi bi-cash-stack"></i>
        </div>
        <div>
            <h1 class="page-title mb-0" style="font-weight: 800; color: #0f172a; font-size: 22px;">Classes Salariais</h1>
            <p class="text-muted mb-0" style="font-size: 13px;">{{ pay_grades.count }} classe(s) cadastrada(s)</p>
        </div>
    </div>
</div>

<div class="card" style="border-radius: 16px; border: none; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); overflow: hidden;">
    <div class="table-responsive">
        <table class="table mb-0 align-middle">
            <thead style="background: #f8fafc;">
                <tr>
                    <th style="font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 0.5px; text-transform: uppercase; padding: 16px 24px; border-bottom: 2px solid #e2e8f0;">NOME DA CLASSE</th>
                    <th class="text-end" style="font-size: 11px; font-weight: 700; color: #64748b; letter-spacing: 0.5px; text-transform: uppercase; padding: 16px 24px; border-bottom: 2px solid #e2e8f0;">AÇÕES</th>
                </tr>
            </thead>
            <tbody>
                {% for pg in pay_grades %}
                <tr>
                    <td style="font-weight: 600; color: #334155; padding: 16px 24px;">{{ pg.name }}</td>
                    <td class="text-end" style="padding: 16px 24px;">
                        <div class="d-flex justify-content-end gap-2">
                            <a href="{% url 'pay_grade_delete' pg.pk %}" class="btn btn-sm btn-light text-danger border-0 shadow-sm" style="border-radius: 8px; width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; background: #fff;" onclick="return confirm('Remover a classe salarial {{ pg.name }}?')" title="Remover">
                                <i class="bi bi-trash3-fill"></i>
                            </a>
                        </div>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="2" class="text-center py-5" style="color:#94a3b8;">
                        <i class="bi bi-cash-stack mb-2 d-block" style="font-size: 24px;"></i>
                        Nenhuma classe salarial encontrada
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
