{% extends "base.html" %}{% block title %}Organização{% endblock %}{% block content %}
<div class="page-header"><h1 class="page-title"><i class="bi bi-building text-orange"></i> Dados da Organização</h1></div>
<div class="row"><div class="col-lg-8"><div class="card"><div class="card-body">
<form method="post" enctype="multipart/form-data">{% csrf_token %}{% for field in form %}<div class="mb-3"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div style="color:var(--danger);font-size:12px;margin-top:4px;">{% for e in field.errors %}{{ e }}{% endfor %}</div>{% endif %}</div>{% endfor %}
<button type="submit" class="btn btn-primary">Salvar Alterações</button>
</form></div></div></div></div>
{% endblock %}
