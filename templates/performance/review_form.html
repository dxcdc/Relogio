{% extends "base.html" %}{% block title %}{{ title }}{% endblock %}{% block content %}
<div class="page-header"><h1 class="page-title">{{ title }}</h1><a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Voltar</a></div>
<div class="row justify-content-center"><div class="col-xl-7 col-lg-9"><div class="card"><div class="card-body">
<form method="post">{% csrf_token %}{% for field in form %}<div class="mb-4"><label class="form-label">{{ field.label }}{% if field.field.required %}<span style="color:var(--danger)">*</span>{% endif %}</label>{{ field }}{% if field.errors %}<div style="color:var(--danger);font-size:12px;margin-top:4px;">{% for e in field.errors %}{{ e }}{% endfor %}</div>{% endif %}</div>{% endfor %}
<div class="d-flex gap-2 justify-content-end"><a href="javascript:history.back()" class="btn btn-outline-secondary">Cancelar</a><button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i> Salvar</button></div>
</form></div></div></div></div>
{% endblock %}
