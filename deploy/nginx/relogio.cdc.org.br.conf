server {
    listen 80;
    server_name relogio.cdc.org.br www.relogio.cdc.org.br;

    client_max_body_size 50M;

    # Arquivos Estáticos (CSS, JS, Imagens)
    location /static/ {
        alias /var/www/relogio/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Arquivos de Mídia Uploaded
    location /media/ {
        alias /var/www/relogio/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy Reverso para a Aplicação Django Gunicorn
    location / {
        proxy_pass http://unix:/run/relogio_cdc.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
